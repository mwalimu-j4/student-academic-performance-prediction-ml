services:
  -   type: web
  name: student-outcome-api
  runtime: python
  buildCommand: pip install -r backend/requirements.txt
  startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: CORS_ORIGINS
        sync: false
      - key: DATABASE_URL
        sync: false
